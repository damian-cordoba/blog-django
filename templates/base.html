<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Datos en Criollo Básico{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'lista_posts' %}">Datos en Criollo Básico</a>
        {% if user.is_authenticated %}
            <a href="{% url 'crear_post' %}">Nuevo post</a>
            <a href="{% url 'mi_perfil' %}">Mi perfil</a>
            <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Salir</button></form>
        {% else %}
            <a href="{% url 'login' %}">Ingresar</a>
            <a href="{% url 'registro' %}">Registrarse</a>
        {% endif %}
    </nav>
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
    {% block header %}{% endblock %}
    {% block content %}{% endblock %}
</body>
</html>
